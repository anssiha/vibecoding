<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Viimeinen Rokkari pystyssä</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icon.svg" sizes="any" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png">
  <meta name="apple-mobile-web-app-title" content="Rokkari">
</head>
<body>
  <div id="stage"></div>
  <div id="hud"></div>
  <div id="flash"></div>
  <button id="settings" class="corner" type="button" aria-label="Asetukset">⚙️</button>
  <button id="mute" class="corner" type="button" aria-label="Äänet päälle/pois">🔊</button>
  <div id="sheet" hidden>
    <div class="panel" role="dialog" aria-label="Asetukset">
      <h2>Asetukset</h2>
      <h3>Juoma <small>(valitse yksi tai useampi)</small></h3>
      <div id="drinkChips" class="chips"></div>
      <h3>Määrä</h3>
      <div id="amountChips" class="chips"></div>
      <button id="closeSheet" type="button">Valmis</button>
    </div>
  </div>
  <div id="update" role="status" hidden>
    <span>Uusi versio saatavilla</span>
    <button id="updateBtn" type="button">Päivitä</button>
    <button id="updateLater" type="button" aria-label="Sulje">✕</button>
  </div>
  <div id="foot">Juo vastuullisesti 🍻</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
